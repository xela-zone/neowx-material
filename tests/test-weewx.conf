WEEWX_ROOT = /home/xela/source/neowx-material

[Station]
    location = "Knik-Fairview, Alaska"
    latitude = 61.5
    longitude = -149.5
    altitude = 71, meter
    station_type = Simulator
    station_url = https://zephos.xela.zone
    rain_year_start = 1
    week_start = 6

[Simulator]
    driver = weewx.drivers.simulator
    mode = simulator

[DatabaseTypes]
    [[SQLite]]
        driver = weedb.sqlite

[Databases]
    [[archive_sqlite]]
        database_name = /home/xela/source/neowx-material/tests/sample-archive.sdb
        database_type = SQLite

[DataBindings]
    [[wx_binding]]
        database = archive_sqlite
        table_name = archive
        unit_system = US

[StdArchive]
    archive_interval = 300
    record_generation = software
    data_binding = wx_binding

[Engine]
    [[Services]]
        prep_services = weewx.engine.StdTimeSynch
        data_services = ,
        process_services = weewx.engine.StdConvert, weewx.engine.StdCalibrate, weewx.engine.StdQC, weewx.wxservices.StdWXCalculate
        xtype_services = weewx.wxxtypes.StdWXXTypes, weewx.wxxtypes.StdPressureCooker, weewx.wxxtypes.StdRainRater, weewx.wxxtypes.StdDelta
        archive_services = weewx.engine.StdArchive
        report_services = weewx.engine.StdPrint, weewx.engine.StdReport

[StdConvert]
    target_unit = US

[StdCalibrate]
    [[Corrections]]

[StdQC]
    [[MinMax]]

[StdReport]
    SKIN_ROOT = /home/xela/source/neowx-material
    HTML_ROOT = /home/xela/source/neowx-material/tests/output
    data_binding = wx_binding

    [[neowx-material]]
        skin = src
        HTML_ROOT = /home/xela/source/neowx-material/tests/output
        enable = true
        [[[Extras]]]
            language = en
            color = indigo
            [[[[Appearance]]]]
                mode = auto
            [[[[Header]]]]
                earthquakes_nav_link = yes
            [[[[Footer]]]]
                name = "Test Station"
                show_about_data = yes
                show_earthquakes = yes
            [[[[Earthquakes]]]]
                enable = yes
                radius_km = 300
                min_magnitude = 2.5
                timespan_days = 7
